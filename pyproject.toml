[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-loan-pricing-raroc-lab"
version = "0.1.0"
description = "Auditable loan pricing and RAROC decision engine for a Vietnam retail lending case"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

