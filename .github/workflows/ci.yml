name: Model controls

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Run model and report controls
        run: python -m unittest discover -s tests -v
      - name: Rebuild deterministic outputs
        run: |
          python -m scripts.run_portfolio
          python -m scripts.build_sensitivity
          python -m scripts.build_extended_reports
      - name: Confirm reproducible reports
        run: git diff --exit-code -- reports
