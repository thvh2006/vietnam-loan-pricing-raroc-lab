name: Deploy loan pricing decision cockpit to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - dashboard/**
      - reports/Vietnam_Loan_Pricing_RAROC_Workbook.xlsx
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/reports
          cp dashboard/index.html _site/index.html
          cp dashboard/styles.css _site/styles.css
          cp dashboard/app.js _site/app.js
          cp reports/Vietnam_Loan_Pricing_RAROC_Workbook.xlsx _site/reports/Vietnam_Loan_Pricing_RAROC_Workbook.xlsx
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
